<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Character Dashboard - Prototype 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .character-avatar {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .level-badge {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .stats-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .stat-item {
            margin-bottom: 15px;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .stat-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .stat-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.3s ease;
        }

        .hit-points { background: linear-gradient(90deg, #ff6b6b, #ff8e8e); }
        .power { background: linear-gradient(90deg, #ff9ff3, #f368e0); }
        .agility { background: linear-gradient(90deg, #54a0ff, #2e86de); }
        .toughness { background: linear-gradient(90deg, #5f27cd, #341f97); }
        .equity { background: linear-gradient(90deg, #00d2d3, #01a3a4); }
        .logic { background: linear-gradient(90deg, #feca57, #ff9ff3); }
        .acting { background: linear-gradient(90deg, #48dbfb, #0abde3); }
        .martial-arts { background: linear-gradient(90deg, #ff6348, #e17055); }

        .stat-button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .stat-button:hover {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .items-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .item-slot {
            aspect-ratio: 1;
            background: #fff;
            border: 3px solid #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .item-slot:hover {
            border-color: #4CAF50;
            transform: scale(1.05);
        }

        .experience-bar {
            margin-top: 20px;
            background: #e0e0e0;
            border-radius: 15px;
            height: 30px;
            position: relative;
            overflow: hidden;
        }

        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #feca57, #ff9f43);
            border-radius: 15px;
            width: 30%;
            transition: width 0.5s ease;
        }

        .exp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="character-avatar">🧙‍♂️</div>
            <div class="level-badge">Level 1 Apprentice</div>
            <h1>Character Dashboard</h1>
        </div>

        <div class="main-content">
            <div class="stats-panel">
                <h2 class="panel-title">Character Stats</h2>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Hit Points</span>
                        <span>100/100</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill hit-points" style="width: 100%"></div>
                        <button class="stat-button" onclick="increaseStat('hit-points')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Power</span>
                        <span>15/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill power" style="width: 30%"></div>
                        <button class="stat-button" onclick="increaseStat('power')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Agility</span>
                        <span>12/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill agility" style="width: 24%"></div>
                        <button class="stat-button" onclick="increaseStat('agility')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Toughness</span>
                        <span>8/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill toughness" style="width: 16%"></div>
                        <button class="stat-button" onclick="increaseStat('toughness')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Equity</span>
                        <span>20/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill equity" style="width: 40%"></div>
                        <button class="stat-button" onclick="increaseStat('equity')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Logic</span>
                        <span>18/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill logic" style="width: 36%"></div>
                        <button class="stat-button" onclick="increaseStat('logic')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Acting</span>
                        <span>5/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill acting" style="width: 10%"></div>
                        <button class="stat-button" onclick="increaseStat('acting')">+</button>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-label">
                        <span>Martial Arts</span>
                        <span>3/50</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-fill martial-arts" style="width: 6%"></div>
                        <button class="stat-button" onclick="increaseStat('martial-arts')">+</button>
                    </div>
                </div>
            </div>

            <div class="items-panel">
                <h2 class="panel-title">Items & Equipment</h2>

                <div class="items-grid">
                    <div class="item-slot">⚔️</div>
                    <div class="item-slot">🛡️</div>
                    <div class="item-slot">💍</div>
                    <div class="item-slot">🏹</div>
                    <div class="item-slot">🧪</div>
                    <div class="item-slot">📜</div>
                </div>

                <h3 style="margin-bottom: 10px;">Experience Progress</h3>
                <div class="experience-bar">
                    <div class="exp-fill"></div>
                    <div class="exp-text">150 / 3000 XP</div>
                </div>

                <p style="margin-top: 10px; text-align: center; color: #666;">
                    Next Level: Skilled Warrior (1850 XP needed)
                </p>
            </div>
        </div>
    </div>

    <script>
        function increaseStat(statName) {
            alert(`${statName} increased! Item obtained! +50 XP gained!`);
        }
    </script>
</body>
</html>
