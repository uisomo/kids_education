<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossy 色と質感の実験</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f0;color:#292737;font:15px/1.7 system-ui,sans-serif}header,main,footer{max-width:1700px;margin:auto;padding:24px}h1{font-size:28px;margin:0}header p{max-width:900px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button,a.link{font:inherit;border:1px solid #c7c1d2;border-radius:12px;padding:9px 14px;background:white;color:#292737}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{background:white;padding:16px;border-radius:20px}h2{font-size:19px;margin:0}article p{min-height:110px;margin:8px 0;color:#655f72}article img{width:100%;display:block;border-radius:10px;cursor:zoom-in}article a{display:inline-block;margin-top:8px;color:#5838a0}dialog{border:0;border-radius:16px;max-height:96vh;max-width:96vw;padding:12px}dialog img{display:block;max-height:85vh;max-width:90vw}dialog::backdrop{background:#161221bb}dialog button{display:block;margin:0 0 8px auto}@media(min-width:1450px){#grid{grid-template-columns:repeat(6,minmax(0,1fr))}article{padding:12px}article p{min-height:100px}}@media(max-width:750px){#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}main{padding:12px}article{padding:10px}h2{font-size:16px}article p{font-size:12px;min-height:80px}}
</style>
<header><a href="../glossy-demo/">← 全35案のGlossy比較</a><h1>色と艶を、もう一段。</h1><p><a href="shape-gloss/">最新：3900の丸い星・3908の円をアイコン風の艶へ →</a></p><p><a href="person-gloss/">新しい比較：人物に透明コーティングを加える →</a></p><p>同じ構図・主色を固定した6案。①→②は艶、②→③はHook、③→④は人物の色、③→⑤は背景の違いです。画像を押すと拡大できます。</p><nav><label>構図 <select id="template"><option value="3886">3886 · 大きな文字と人物</option><option value="3889">3889 · 7枚のカード</option></select></label><label>表示 <select id="kind"><option value="hook">Hook付き</option><option value="art">構図のみ</option></select></label></nav></header>
<main><div id="grid" aria-live="polite"></div></main><footer>比較用の静止画です。元動画・採用済み配色・iPhone実装は更新していません。人物は既存の切り抜き素材を使用しており、元録画の解像度による粗さは残ります。動く反射は今回の比較には含みません。</footer>
<dialog id="zoom"><button id="close">閉じる</button><img id="large" alt="拡大比較"></dialog>
<script>
const $=s=>document.querySelector(s);let rows=[];
function render(){const id=$('#template').value,kind=$('#kind').value;$('#grid').replaceChildren(...rows.map(([v,title,note])=>{const a=document.createElement('article');const h=document.createElement('h2');h.textContent=v+' · '+title;const p=document.createElement('p');p.textContent=note;const img=document.createElement('img');img.src=`${id}-${v}-${kind}.jpg?v=2`;img.alt=`${id} ${title} ${kind==='hook'?'Hook付き':'構図のみ'}`;img.onclick=()=>{$('#large').src=img.src;$('#large').alt=img.alt;$('#zoom').showModal()};const link=document.createElement('a');link.href=img.src;link.download='';link.textContent='画像を保存';a.append(h,p,img,link);return a}))}
$('#template').onchange=$('#kind').onchange=render;$('#close').onclick=()=>$('#zoom').close();fetch('data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{rows=data;render()}).catch(()=>{$('#grid').textContent='比較画像を読み込めませんでした。再読み込みしてください。'});
</script></html>
