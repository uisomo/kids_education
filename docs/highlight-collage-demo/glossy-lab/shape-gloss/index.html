<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図形をアイコンの艶へ</title><style>*{box-sizing:border-box}body{background:#f6f3ef;color:#272332;margin:0;font:15px/1.7 system-ui}header,main,footer{max-width:1200px;margin:auto;padding:20px}h1{font-size:28px;margin:8px 0}nav{display:flex;gap:12px;flex-wrap:wrap}select,button{font:inherit;padding:9px;border:1px solid #cac3cd;border-radius:10px;background:white}#grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{padding:14px;background:white;border-radius:16px}h2{font-size:19px;margin:0}article p{min-height:3.4em}img{display:block;width:100%;cursor:zoom-in}a{color:#5d3a90}dialog{border:0;border-radius:12px;max-height:96vh;max-width:96vw}dialog img{max-height:85vh;width:auto;max-width:90vw}dialog button{display:block;margin-left:auto}dialog::backdrop{background:#191224bb}.rules{background:#fff;padding:12px 18px;border-radius:12px}footer{font-size:13px}@media(max-width:600px){header,main,footer{padding:12px}#grid{gap:8px}article{padding:8px}article p{font-size:12px;min-height:5.1em}h2{font-size:16px}}</style>
<header><a href="../">← 色と艶の比較へ</a><h1>生成素材を使う見本</h1><p><a href="../whole-gloss/">最新：3900の構図全体を生成して写真・文字を合成 →</a></p><p>コードで付けた艶は不採用とし、候補から外しました。</p><p class="rules">写真：自然なカラー・内部の反射なし ／ 星：先端も谷も丸く ／ 文字：余分な艶を外してくっきり</p><nav><label>構図 <select id="template"><option value="3900">3900 · 手描き風の星 → 丸い星</option><option value="3908">3908 · 大きな円</option><option value="3897">3897 · 青の濃淡</option><option value="3885">3885 · ベリー色の濃淡</option></select></label><label>表示 <select id="kind"><option value="art">構図のみ</option><option value="hook">Hook付き</option></select></label></nav></header><main><div id="grid"></div></main><footer>両側とも写真・文字を今回の方針に合わせ、図形の変更を比較しています。全35案への展開前の見本です。生成素材は丸・パネル・星を個別に作成し、元の座標へ合成したものです。背景全体を一括生成する方法は未比較です。既存動画と本番はまだ変更していません。</footer><dialog id="zoom"><button id="close">閉じる</button><img id="large" alt="図形の拡大比較"></dialog><script>
const $=s=>document.querySelector(s);function render(){const id=$('#template').value,kind=$('#kind').value,tone=['3897','3885'].includes(id);const rows=tone?[[1,'単色の濃淡','写真と背景を同系色へ。']]:[[3,'OpenAIで生成した素材','生成した素材を元の座標へ。個別素材版は以前の比較用。最新の背景全体生成もご覧ください。']];$('#grid').innerHTML=rows.map(([v,title,note])=>`<article><h2>${title}</h2><p>${note}</p><img src="${id}-${v}-${kind}.jpg?v=6" alt="${id} ${title}"></article>`).join('')}
$('#template').onchange=$('#kind').onchange=render;$('#grid').onclick=e=>{if(e.target.tagName==='IMG'){$('#large').src=e.target.src;$('#zoom').showModal()}};$('#close').onclick=()=>$('#zoom').close();render();</script></html>
