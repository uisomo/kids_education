<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物の透明コーティング比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3f0;color:#292737;font:15px/1.7 system-ui}header,main,footer{padding:22px;max-width:1700px;margin:auto}h1{margin:8px 0;font-size:27px}nav{display:flex;flex-wrap:wrap;gap:12px}select,button{font:inherit;padding:8px 12px;border:1px solid #c8c3d0;border-radius:10px;background:white;color:#292737}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{background:white;border-radius:16px;padding:12px}h2{font-size:18px;margin:0}article p{font-size:13px;min-height:5.1em}figure{position:relative;margin:0}img{width:100%;display:block;border-radius:8px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}a{color:#573c96}article a{font-size:13px}dialog{border:0;border-radius:14px;padding:12px;max-height:96vh}dialog img{max-height:85vh;width:auto;max-width:90vw}dialog button{display:block;margin-left:auto}dialog::backdrop{background:#181224bb}@media(max-width:1000px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){header,main,footer{padding:12px}#grid{gap:8px}h2{font-size:15px}article{padding:8px}article p{min-height:6.8em;font-size:12px}}</style>
<header><a href="../">← 色と艶の6案へ</a><h1>人物に、薄い透明コーティング。</h1><p>①「カラー＋なめらか」を固定して、人物の内側の反射だけを比較。顔の検出位置では反射を弱めています。3889の左上の見出しは艶を外し、輪郭をくっきりさせました。</p><nav><label>構図 <select id="template"><option value="3886">3886 · 大きな文字と人物</option><option value="3889">3889 · 7枚のカード</option></select></label><label>表示 <select id="kind"><option value="art">構図のみ</option><option value="hook">Hook付き</option></select></label><button id="replay">反射をもう一度</button></nav></header><main><div id="grid"></div></main><footer>比較用。元動画と本番は未変更。動く反射はこのページ内のプレビューです。写真の解像度や肌・服の立体照明は変えていません。</footer><dialog id="zoom"><button id="close">閉じる</button><img id="large" alt="拡大比較"></dialog>
<script>
const $=s=>document.querySelector(s);let generation=0;const rows=[['① そのまま','人物内部に反射なし。自然なカラー＋縁の艶。'],['A · 薄いコーティング','肩・服を中心に、柔らかな反射を薄く重ねます。'],['B · 少し強め','Aと同じ位置の反射を強めた比較。白く曇りすぎないか確認。'],['C · 一度だけ動く反射','①をベースに、人物の内側を光が一度通過。ボタンで再生できます。']];
async function render(){const current=++generation,id=$('#template').value,kind=$('#kind').value;$('#grid').innerHTML=rows.map(([title,note],i)=>`<article><h2>${title}</h2><p>${note}</p><figure><img src="${id}-${i===3?0:i}-${kind}.jpg?v=2" alt="${id} ${title}" data-index="${i}">${i===3?'<canvas id="shine" width="720" height="1280" aria-hidden="true"></canvas>':''}</figure><a href="${id}-${i===3?0:i}-${kind}.jpg" download>${i===3?'反射前の画像を保存':'画像を保存'}</a></article>`).join('');await Promise.all([...$('#grid').querySelectorAll('img')].map(im=>im.decode()));if(current===generation&&!matchMedia('(prefers-reduced-motion: reduce)').matches)replay()}
async function replay(){const token=++generation,canvas=$('#shine');if(!canvas)return;const ctx=canvas.getContext('2d'),mask=new Image();mask.src=`${$('#template').value}-${$('#kind').value}-reflection.png?v=2`;await mask.decode();if(token!==generation)return;const start=performance.now();function tick(now){if(token!==generation)return;let u=(now-start)/2600;ctx.clearRect(0,0,720,1280);if(u>=1)return;ctx.globalCompositeOperation='source-over';ctx.drawImage(mask,0,0);ctx.globalCompositeOperation='destination-in';let x=-650+u*2000;const gr=ctx.createLinearGradient(x,0,x+390,260);gr.addColorStop(0,'#ffffff00');gr.addColorStop(.4,'#ffffffbb');gr.addColorStop(.53,'#ffffffff');gr.addColorStop(1,'#ffffff00');ctx.fillStyle=gr;ctx.fillRect(0,0,720,1280);ctx.globalCompositeOperation='source-over';requestAnimationFrame(tick)}requestAnimationFrame(tick)}
$('#template').onchange=$('#kind').onchange=()=>render().catch(()=>{$('#grid').textContent='画像を読み込めませんでした。再読み込みしてください。'});$('#replay').onclick=replay;$('#grid').onclick=e=>{if(e.target.tagName==='IMG'){$('#large').src=e.target.src;$('#zoom').showModal()}};$('#close').onclick=()=>$('#zoom').close();render();
</script></html>
